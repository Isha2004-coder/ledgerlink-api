version: "3.9"
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ledgerlink
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    build: .
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/ledgerlink
      JWT_SECRET: dev_secret_change_me
      PORT: 5001
    ports:
      - "5001:5000"
    command: npm run dev
    volumes:
      - .:/app
      - /app/node_modules
volumes:
  pgdata:
